<!DOCTYPE html>

    { id: "Pr_05", q: "Modulační index u AM (m) by neměl překročit 1 (100 %), protože:", opts: ["Dochází k přemodulování a zkreslení zprávy", "Zanizne nosná vlna", "Vznikají nekonečná postranní pásma", "Sníží se šum"], ans: [0, 1], hint: "Obálka signálu by překřížila osu.", tips: ["Informace je nečitelná.", "Matematicky nosná zmizí.", "To u FM, ne AM.", "Lež, šum se nemění."], pts: 1.5 },
    { id: "Pr_04", q: "Rozmítaný spektrální analyzátor pracuje na principu:", opts: ["Superheterodynního přijímače", "Zobrazení Fourierovy řady analogově", "Přímého zesílení signálu", "Měření fázového závěsu"], ans: [0], hint: "Ladicí oscilátor mění MF kmitočet.", tips: ["Základní architektura.", "To je spektrální analýza.", "To by nefungovalo.", "PLL je jen část."], pts: 1.0 },
    { id: "Pr_06", q: "Zisk antény (G) přímo ovlivňuje:", opts: ["Vyzářený výkon v daném směru (EIRP)", "Energetickou bilanci spoje", "Frekvenci vysílání", "Hmotnost stožáru"], ans: [0, 1], hint: "Zisk soustřeďuje energii do směru.", tips: ["Směrovost zvyšuje EIRP.", "Více zisku = delší dosah.", "Anténa frekvenci nemění.", "Pouze nepřímo mechanicky."], pts: 1.5 },
    { id: "Pr_02", q: "Standardní nejistota typu A (uA) klesá s:", opts: ["Rostoucím počtem měření (n)", "Lepší třídou přesnosti přístroje", "Kvalitnější kalibrací", "Zvětšením rozsahu"], ans: [0], hint: "Vychází ze směrodatné odchylky průměru.", tips: ["uA = s / odmocnina(n).", "To ovlivňuje uB.", "To ovlivňuje uB.", "To naopak chybu zvyšuje."], pts: 1.0 },
    { id: "Pr_04", q: "Při měření 'AM hloubky modulace' na spektráku vidíme:", opts: ["Nosnou a dvě postranní čáry", "Amplitudu zprávy v dB vůči nosné", "Konstelační diagram", "Pouze nosnou"], ans: [0, 1], hint: "Vzdálenost postranních čar odpovídá modulační frekvenci.", tips: ["Typické AM spektrum.", "Rozdíl v dB dává index m.", "To u digitálních modulací.", "To u nemodulované nosné."], pts: 1.5 },
    { id: "Pr_03", q: "Vstupní impedance osciloskopu je typicky:", opts: ["1 MOhm paralelně s jednotkami pF", "50 Ohm pro vf měření", "0 Ohm", "10 GOhm"], ans: [0, 1], hint: "Záleží na aplikaci (standard vs. vf).", tips: ["Standardní vstup.", "Přizpůsobený vstup.", "To je ampérmetr.", "To je elektrometrický zesilovač."], pts: 1.0 },
    { id: "Pr_05", q: "Fázový šum (Phase Noise) se u oscilátoru projevuje jako:", opts: ["Rozšíření paty spektrální čáry nosné", "Jitter v časové doméně", "Změna barvy signálu", "Ztráta amplitudy"], ans: [0, 1], hint: "Krátkodobá nestabilita frekvence.", tips: ["Vizuální projev na SA.", "Projev na osciloskopu.", "Nesmysl.", "Nesmysl."], pts: 1.5 }
];

let data = [], curScore = 0, maxPosScore = 0, solved = 0;

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function start() {
    const qS = document.getElementById('shufQ').checked, aS = document.getElementById('shufA').checked;
    data = JSON.parse(JSON.stringify(master));
    if(qS) shuffle(data);
    if(aS) data.forEach(d => {
        let os = d.opts.map((o,i) => ({t:o, c:d.ans.includes(i), tip: d.tips[i]}));
        shuffle(os);
        d.opts = os.map(o => o.t); 
        d.tips = os.map(o => o.tip);
        d.ans = os.reduce((a,o,i) => {if(o.c) a.push(i); return a;}, []);
    });
    document.getElementById('setup').style.display = 'none';
    renderNav(); renderQuiz();
}

function renderNav() {
    const g = document.getElementById('navGrid');
    data.forEach((_, i) => {
        let d = document.createElement('div');
        d.className = 'nav-item'; d.id = `nav-${i}`;
        d.innerText = i + 1;
        d.onclick = () => document.getElementById(`qcard-${i}`).scrollIntoView({behavior:'smooth'});
        g.appendChild(d);
    });
}

function renderQuiz() {
    const c = document.getElementById('quiz');
    data.forEach((d, i) => {
        let isM = d.ans.length > 1;
        let card = document.createElement('div');
        card.className = 'q-card'; card.id = `qcard-${i}`;
        card.innerHTML = `
            <div class="q-header">
                <div style="display:flex; align-items:center; gap:8px">
                    <span class="blue-sq-icon" id="sq-${i}" onclick="toggleSquare(${i})"></span>
                    <span class="q-title" id="num-display-${i}">Otázka číslo ${i+1} (${d.id})</span>
                </div>
                <div style="color:var(--primary); font-weight:bold; font-size:0.85em">${d.pts.toFixed(2)} b</div>
            </div>
            <div style="margin-bottom:12px; font-size:0.95em">${d.q}</div>
            <div id="opts-${i}">
                ${d.opts.map((o,oi) => `
                    <label class="opt-label" id="label-${i}-${oi}">
                        <input type="${isM?'checkbox':'radio'}" name="q${i}" value="${oi}">
                        <span>${o}</span>
                    </label>
                    <div class="rationale-box" id="rat-${i}-${oi}">${d.tips[oi]}</div>
                `).join('')}
            </div>
            <div class="hint-box" id="hint-${i}">${d.hint}</div>
            <div class="btn-row">
                <button class="action-btn hint-btn" id="hbtn-${i}" onclick="showHint(${i})">Nápověda</button>
                <button class="action-btn check-btn" id="btn-${i}" onclick="check(${i})">Odevzdat</button>
            </div>
            <div id="feedback-${i}" style="margin-top:10px; font-weight:bold; font-size:0.85em; display:none"></div>
        `;
        c.appendChild(card);
    });
}

function showHint(i) {
    document.getElementById(`hint-${i}`).style.display = 'block';
    document.getElementById(`hbtn-${i}`).disabled = true;
}

function toggleSquare(i) {
    const icon = document.getElementById(`sq-${i}`);
    const navItem = document.getElementById(`nav-${i}`);
    const numDisplay = document.getElementById(`num-display-${i}`);
    icon.classList.toggle('active');
    navItem.classList.toggle('flagged');
    const isAct = icon.classList.contains('active');
    navItem.innerText = isAct ? '?' : i + 1;
    numDisplay.innerText = isAct ? `Otázka číslo ? (${data[i].id})` : `Otázka číslo ${i+1} (${data[i].id})`;
}

function check(i) {
    const d = data[i], block = document.getElementById(`opts-${i}`);
    const sel = Array.from(block.querySelectorAll('input:checked')).map(n => parseInt(n.value));
    if(!sel.length) return alert("Vyberte odpověď!");

    document.getElementById(`btn-${i}`).disabled = true;
    block.querySelectorAll('input').forEach(inp => inp.disabled = true);

    let correctCount = 0, wrongCount = 0;
    d.ans.forEach(a => { if(sel.includes(a)) correctCount++; });
    sel.forEach(s => { if(!d.ans.includes(s)) wrongCount++; });

    let gain = (correctCount - wrongCount) * (d.pts / d.ans.length);
    if(gain < 0) gain = 0;
    
    curScore += gain; maxPosScore += d.pts; solved++;

    d.opts.forEach((_, oi) => {
        const rat = document.getElementById(`rat-${i}-${oi}`);
        rat.style.display = 'block';
        const label = document.getElementById(`label-${i}-${oi}`);
        if(d.ans.includes(oi)) {
            label.classList.add('correct');
            rat.style.color = '#1e8e3e';
        } else if(sel.includes(oi)) {
            label.classList.add('wrong');
            rat.style.color = '#d93025';
        }
    });

    const feed = document.getElementById(`feedback-${i}`);
    feed.style.display = 'block';
    feed.innerText = `Získáno ${gain.toFixed(2)} z ${d.pts.toFixed(2)} b`;
    feed.style.color = gain === d.pts ? '#1e8e3e' : '#d93025';

    let nav = document.getElementById(`nav-${i}`);
    nav.classList.add(gain === d.pts ? 'status-green' : 'status-red');

    document.getElementById('prog').innerText = `Zodpovězeno: ${solved} / 40`;
    document.getElementById('score').innerText = `Body: ${curScore.toFixed(2)} / ${maxPosScore.toFixed(2)}`;
}
</script>
